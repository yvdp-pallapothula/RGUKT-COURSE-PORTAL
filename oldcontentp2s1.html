 
 <!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>P2S1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f6ff;
      color: #2d2d2d;
    }

    header {
      padding: 40px 20px 30px;
      text-align: center;
    }

    main {
      padding: 40px 20px;
      text-align: center;
    }

    ul {
      list-style-type: none;
      max-width: 400px;
      margin: 0 auto;
      padding: 0;
    }

    li a {
      display: block;
      background-color: #e8e3f5;
      margin: 15px 0;
      padding: 15px;
      text-decoration: none;
      color: #4b2e7a;
      border-left: 6px solid #9c7dd8;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      font-size: 1.1rem;
      font-weight: 500;
    }

    li a:hover,
    .dropdown-btn:hover {
      background-color: #dcd1f0;
      transform: scale(1.02);
    }

    .dropdown {
      position: relative;
      width: 100%;
    }

    .dropdown-btn {
      display: block;
      width: 100%;
      background-color: #e8e3f5;
      padding: 15px;
      color: #4b2e7a;
      font-size: 1.1rem;
      font-weight: 500;
      text-align: left;
      border: none;
      border-left: 6px solid #9c7dd8;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dropdown-content {
      background-color: transparent;
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
      padding-left: 10px;
    }

    .dropdown-content.show {
      max-height: 500px;
      padding-top: 8px;
    }

    footer {
      background-color: #f1ecfb;
      color: #4b3b63;
      text-align: center;
      padding: 30px 20px;
      margin-top: 40px;
      font-size: 0.95rem;
      border-top: 2px solid #cbb6e2;
      font-family: sans-serif;
    }

    footer p {
      margin: 0 0 10px;
    }

    footer img {
      height: 20px;
      width: 20px;
      filter: grayscale(1);
    }

    @media (max-width: 600px) {
      li a {
        font-size: 1rem;
      }
      .dropdown-btn {
        font-size: 1rem;
      }
    }
  </style>
</head>
