<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PUC 2 SEM 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- CORE CSS (Background, Hover, Button, Footer, Text) --- */
        
        /* Base styles (Body Background and Text) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f6ff; color: #2d2d2d; }
        
        main { padding: 40px 20px; text-align: center; }
        main p { font-size: 1.4rem; margin-bottom: 25px; font-weight: 600; color: #4b3b63; }
        ul { list-style-type: none; padding: 0; max-width: 400px; margin: 0 auto; }

        /* Subject Button Styles (Light Color Button) */
        .subject-btn {
            display: block; margin: 15px 0; padding: 15px; text-decoration: none; border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; font-size: 1.1rem; font-weight: 500; width: 100%; border: none;
            cursor: pointer;
        }

        /* Glittering Style adapted for the main buttons */
        .glittering-subject-btn {
            background-color: #E8E3F5; /* Light Lavender background */
            color: #4b2e7a; /* Deep Purple text for contrast */
            border-left: 6px solid #4b2e7a; /* Dark border for high contrast */
            text-align: center;
            /* Simulating 'glittering' with text shadow and box shadow */
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.2), 
                        0 0 10px rgba(100, 70, 150, 0.1); 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .glittering-subject-btn:hover {
            background-color: #DCD1F0; /* Slightly darker light lavender on hover */
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3), 0 0 20px #E8E3F5; /* Enhanced shadow and light glow */
            transform: scale(1.03);
        }

        /* --- MODAL STRUCTURE STYLES (REQUIRED FOR OVERLAY) --- */
        .modal-overlay {
            position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 9999;
            visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-content { max-width: 500px; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); transform: scale(0.9); transition: transform 0.3s ease-out; }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-inner-content { background-color: white; padding: 25px; border-radius: 10px; }

        /* --- MODAL UNIT LINK STYLING --- */
        /* Link styling inside the white box */
        .unit-link-item a {
            padding: 12px; margin: 5px 0; border-radius: 6px; text-decoration: none;  
            color: #333333; /* Dark Charcoal Gray for text (Avoiding purple) */
            background-color: #F1E9F5; /* Very light lavender background */
            font-weight: 500; display: flex; justify-content: space-between; align-items: center; 
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .unit-link-item a:hover {
            background-color: #E6D9F0; /* Slightly darker lavender on hover */
        }
        
        /* --- FOOTER STYLES --- */
        .credit-box { font-size: 0.8rem; color: #5a4a71; background-color: #f1ecfb; padding: 8px 12px; border-radius: 6px; text-align: center; margin: 20px auto; max-width: 300px; line-height: 1.4; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); }
        footer { background-color: #e8e3f5; color: #4b3b63; text-align: center; padding: 30px 20px; margin-top: 40px; font-size: 0.95rem; border-top: 2px solid #cbb6e2; }
        footer p { font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        .social-icons { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
        .social-icons img { height: 20px; width: 20px; filter: grayscale(1); transition: transform 0.3s ease; }
        .social-icons img:hover { transform: scale(1.1); }
        .copyright { font-size: 12px; color: #444; }

        @media (max-width: 600px) {
            .subtitle { font-size: 1.6rem; }
        }
    </style>

    <script>
        // --- MODAL COLOR PALETTE (UNIQUE BACKGROUND COLORS - UPDATED) ---
        const modalColors = {
            eng: '#B0E0E6',  // Powder Blue
            tel: '#F5DEB3',  // Pale Goldenrod
            math: '#D8BFD8', // Thistle (Soft Lavender)
            phy: '#A9D8AD',  // Soft Sage Green
            it: '#ADD8E6',   // Light Blue
            chem: '#F08080'  // Light Coral
        };

        // --- NEW: NEUTRAL COLOR FOR ALL MODAL TEXT/BUTTONS (Not Deep Violet) ---
        const modalContentColor = '#333333'; // Dark Charcoal Gray

        // --- DATA STRUCTURE: PDF links and Titles (UPDATED FOR PUC II SEMESTER 2) ---
        const subjectData = {
            eng: { key: 'eng', name: 'English-IV', files: [
                { title: 'The Adventures of Tom Sawyer (Ch. 1–4) & List of Characters', url: 'https://example.com/pdfs/eng/tom_sawyer_unit1.pdf' },
                { title: 'The Adventures of Tom Sawyer (Ch. 5–8 & Summary)', url: 'https://example.com/pdfs/eng/tom_sawyer_unit2.pdf' },
                { title: 'The Tiger King (Prose) & Describing a Process', url: 'https://example.com/pdfs/eng/tiger_king.pdf' },
                { title: 'Completing a Form & Language of Advertisements', url: 'https://example.com/pdfs/eng/adverts_forms.pdf' },
                { title: 'Learning from the West (Prose) & Curriculum Vitae (CV)', url: 'https://example.com/pdfs/eng/cv_learning.pdf' },
                { title: 'Any Woman (Poem) & Vocabulary/Comprehension', url: 'https://example.com/pdfs/eng/any_woman_vocab.pdf' }
            ]},
            tel: { key: 'tel', name: 'Telugu-IV', files: [
                { title: 'తెలుగు జాతి విలేకం (81-100 పద్యాలు)', url: 'https://example.com/pdfs/tel/unit1_padhyam.pdf' },
                { title: 'తెలుగు జాతి విలేకం (141-160 పద్యాలు)', url: 'https://example.com/pdfs/tel/unit2_padhyam.pdf' },
                { title: 'ప్రహ్లాదుని విద్య – బమ్మెర పోతన', url: 'https://example.com/pdfs/tel/prahladuni_vidya.pdf' },
                { title: 'అలంకారాలు (శబ్ద & అర్థాలంకారాలు)', url: 'https://example.com/pdfs/tel/alankaralu.pdf' },
                { title: 'ఛందస్సు (జాతులు & ఉపజాతులు)', url: 'https://example.com/pdfs/tel/chandassu.pdf' },
                { title: 'వ్యాసం & వ్యాసాలు (పర్యావరణం, విజ్ఞానం, మొదలైనవి)', url: 'https://example.com/pdfs/tel/vyasalu.pdf' }
            ]},
            math: { key: 'math', name: 'Mathematics-IV', files: [
                { title: ' Methods of Integration (Basic Formulas, By Parts, Partial Fractions)', url: 'https://example.com/pdfs/math/methods_integration.pdf' },
                { title: 'Conic Sections (Circle, Parabola, Ellipse, Hyperbola)', url: 'https://example.com/pdfs/math/conic_sections.pdf' },
                { title: ' Parametrization & Polar Coordinates (Graphing, Area, Length)', url: 'https://example.com/pdfs/math/polar_coordinates.pdf' },
                { title: ' Matrices (Algebra, Determinant, Rank, Linear Equations)', url: 'https://example.com/pdfs/math/matrices_rank.pdf' },
                { title: 'Infinite Series (Binomial, Geometric, Logarithmic)', url: 'https://example.com/pdfs/math/infinite_series.pdf' },
                { title: ' Vector Algebra (Dot Product, Cross Product, 3D Vectors)', url: 'https://example.com/pdfs/math/vector_algebra.pdf' }
            ]},
            phy: { key: 'phy', name: 'Physics-IV', files: [
                { title: 'Electromagnetic Induction & Alternating currents', url: 'https://example.com/pdfs/phy/emi_ac.pdf' },
                { title: 'Electromagnetic Waves', url: 'https://example.com/pdfs/phy/em_waves.pdf' },
                { title: ' Ray Optics and Optical instruments', url: 'https://example.com/pdfs/phy/ray_optics.pdf' },
                { title: ' Wave Optics', url: 'https://example.com/pdfs/phy/wave_optics.pdf' },
                { title: ' Quantum Physics (Photoelectric Effect, Nuclear Physics)', url: 'https://example.com/pdfs/phy/quantum_physics.pdf' },
                { title: 'Semiconductor Electronics (Diode, Zener, Transistor)', url: 'https://example.com/pdfs/phy/semiconductors.pdf' }
            ]},
            it: { key: 'it', name: 'Python Programming Language', files: [
                { title: 'Introduction and Features of Python, Operators', url: 'https://example.com/pdfs/it/python_intro.pdf' },
                { title: ' Data Types, I/O, Errors and Conditional Control Structures', url: 'https://example.com/pdfs/it/python_datatypes.pdf' },
                { title: ' Loop Control Statements and Functions', url: 'https://example.com/pdfs/it/python_loops.pdf' },
                { title: ' Strings (Indexing, Operations, Built-in Functions)', url: 'https://example.com/pdfs/it/python_strings.pdf' },
                { title: ' List and Tuples (Creation, Indexing, Modifications)', url: 'https://example.com/pdfs/it/python_lists_tuples.pdf' },
                { title: 'Dictionary and Exception Handling', url: 'https://example.com/pdfs/it/python_dicts_files.pdf' }
            ]},
            chem: { key: 'chem', name: 'Chemistry-IV', files: [
                { title: ' Aldehydes and Ketones (Nomenclature, Reactions)', url: 'https://example.com/pdfs/chem/aldehydes_ketones.pdf' },
                { title: 'Carboxylic acids and Amines (Preparation, Acidity/Basicity)', url: 'https://example.com/pdfs/chem/acids_amines.pdf' },
                { title: ' d-block elements and Coordination compounds', url: 'https://example.com/pdfs/chem/dblock_coordination.pdf' },
                { title: 'Surface Chemistry (Adsorption, Colloids, Emulsions)', url: 'https://example.com/pdfs/chem/surface_chemistry.pdf' },
                { title: ' Metallurgy (Concentration, Extraction of Fe, Cu, Al)', url: 'https://example.com/pdfs/chem/metallurgy.pdf' },
                { title: ' Polymers (Classification, Rubber, Bakelite)', url: 'https://example.com/pdfs/chem/polymers.pdf' }
            ]}
        };
        
        // --- MODAL FUNCTIONS (Dynamic Styling via JS) ---

        function closeSubjectModal() {
            const modalOverlay = document.getElementById('subject-modal-overlay');
            const modalContent = document.getElementById('modal-content-container');
            modalContent.classList.remove('show');
            modalOverlay.classList.remove("show");
        }

        function openSubjectModal(subjectKey) {
            const data = subjectData[subjectKey];
            const color = modalColors[subjectKey];
            const contentColor = modalContentColor; // Dark Charcoal Gray for text/icons
            const modalOverlay = document.getElementById('subject-modal-overlay');
            const modalContent = document.getElementById('modal-content-container');

            // --- 1. Generate the HTML content for the units (PDF links) ---
            let unitHtml = '';
            
            data.files.forEach((file, index) => {
                const unitNumber = index + 1;
                const pdfUrl = file.url;
                const unitTitle = file.title;
                
                // Uses the specific CSS class 'unit-link-item a'
                unitHtml += `
                    <li class="unit-link-item">
                        <a href="${pdfUrl}" target="_blank">
                            <span style="font-weight: 600;">Unit ${unitNumber}:</span> ${unitTitle}
                            <!-- PDF Icon (Uses the Dark Charcoal color) -->
                            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 20 20" fill="currentColor" style="color:${contentColor};">
                                <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 10a1 1 0 000 2h8a1 1 0 100-2H6zm0-3a1 1 0 000 2h8a1 1 0 100-2H6zm0-3a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                            </svg>
                        </a>
                    </li>
                `;
            });
            
            // --- 2. Generate the full Modal content (REMOVED ACCIDENTAL COMMENT TEXT) ---
            const modalInnerHtml = `
                <div style="background-color: ${color}; padding: 25px;"> 
                    <div style="background-color: white; padding: 25px; border-radius: 10px;">
                        <h2 style="font-size:1.5rem; color:${contentColor}; /* DARK GRAY HEADER */ border-bottom: 2px solid #ccc; padding-bottom: 5px; margin-bottom: 15px;">${data.name} Units</h2>
                        <ul style="list-style: none; padding: 0;">
                            ${unitHtml}
                        </ul>
                        <button onclick="closeSubjectModal()" style="background-color: red; /* RED CLOSE BUTTON */ color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background-color 0.2s; margin-top: 20px; display: block; width: 100%;">Close</button>
                    </div>
                </div>
            `;
            
            // 3. Populate and show the modal
            modalContent.innerHTML = modalInnerHtml;
            modalOverlay.classList.add('show');
            setTimeout(() => { modalContent.classList.add('show'); }, 10);
        }

        // --- PORTAL INITIALIZATION ---
        function createSubjectButtons(subjectList) {
            Object.keys(subjectData).forEach(key => {
                const data = subjectData[key];
                
                const listItem = document.createElement('li');
                listItem.classList.add('subject-item');
                
                const subjectButton = document.createElement('button');
                subjectButton.className = 'subject-btn glittering-subject-btn';
                subjectButton.textContent = data.name;
                subjectButton.onclick = () => openSubjectModal(key);

                listItem.appendChild(subjectButton);
                subjectList.appendChild(listItem); // Use appendChild to maintain correct order
            });
        }
        
        // Initialize the portal when the page loads
        window.onload = function() {
            const subjectList = document.getElementById('subject-list');
            
            if (subjectList) {
                createSubjectButtons(subjectList); 
            }
        };
    </script>
</head>

<body>

<main>
    <h1 style="font-size: 2rem; font-weight: bold; color: #46286b; text-align: center; margin-bottom: 25px;">PUC 2 SEM 2</h1>
    <p>Select a Subject to view Units</p>
    <ul id="subject-list">
        <!-- Subject buttons are dynamically injected here -->
    </ul>
</main>

<div class="credit-box">

</div>

    <div id="modal-content-container" class="modal-content" onclick="event.stopPropagation()">
        <!-- Content injected here -->
    </div>
</div>
<!-- --- END MODAL STRUCTURE --- -->


<footer>

</footer>

</body>
</html>
