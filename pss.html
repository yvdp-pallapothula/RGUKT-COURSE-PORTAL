<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PUC 2 SEM 2 - Papers</title>
  <style>
    /* --- Base Styles --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Flexbox wrapper to keep footer at bottom */
    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f6ff;
      color: #2d2d2d;
      display: flex;
      flex-direction: column;
    }

    header { padding: 40px 20px 20px; text-align: center; }
    h1 { font-size: 2.2rem; color: #46286b; }
    h2 { font-size: 1.1rem; color: #6e4c9e; font-weight: 500; margin-top: 5px; }

    main {
      flex: 1 0 auto; /* Pushes footer down */
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      width: 100%;
      text-align: center;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 30px;
      color: #4b3b63;
    }

    /* --- Button Layout (PC Default) --- */
    .button-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 side-by-side on PC */
      gap: 15px;
    }

    /* Styles for the direct links */
    .direct-link {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #e8e3f5;
      height: 80px;
      color: #4b2e7a;
      text-decoration: none;
      border-left: 6px solid #9c7dd8;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .direct-link:hover {
      background-color: #dcd1f0;
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    /* --- Footer Styles --- */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 30px 20px;
      background: #f1ecfb;
      border-top: 2px solid #cbb6e2;
    }

    .social-icons { margin-bottom: 15px; }
    .social-icons img {
      width: 22px;
      margin: 0 12px;
      filter: grayscale(1);
      transition: 0.3s;
    }
    .social-icons img:hover { filter: none; }

    .copyright {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    /* --- MOBILE STYLES (Vertical Layout) --- */
    @media (max-width: 768px) {
      .button-container {
        grid-template-columns: 1fr; /* 1 column stack on Mobile */
        max-width: 350px;
        margin: 0 auto;
      }
      
      .direct-link {
        height: 65px;
        font-size: 1.05rem;
      }

      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>PUC 2 SEM 2</h1>
    <h2>Student Course Portal</h2>
  </header>

  <main>
    <p class="section-title">Select Examination Category</p>
    
    <div class="button-container">
      
      <a href="https://drive.google.com/file/d/1aRKBFBy0r73mjnL4ZwSbVbW6VqOBlh5y/view?usp=drivesdk" class="direct-link">MID - 1</a>
      <a href="https://drive.google.com/file/d/1jT5cENBoo-DcMYO00plXCWD5lgNv1hsK/view?usp=drivesdk" class="direct-link">MID - 2</a>
      <a href="https://drive.google.com/file/d/1A2U0Ev4clKtMYx0HPUXA5EBNzkkpcUKn/view?usp=drivesdk" class="direct-link">MID - 3</a>
      <a href="https://drive.google.com/file/d/1STCeenZJVsuwlcfxkgI4NcJKQ7U1hRsk/view?usp=drivesdk" class="direct-link">SEMESTER</a>

    </div>
  </main>

  <footer>
 <p>Made with ❤️ for Rguktians</p>
<br>
    <div class="social-icons">
      <a href="https://www.youtube.com/@its_me_yugandhar" target="_blank">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube">
      </a>
      <a href="https://www.instagram.com/@yugandhar_pallapothula_" target="_blank">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
      </a>
    </div>
   
    <p class="copyright">&copy; 2025 Course Portal</p>
  </footer>

</body>
</html>
